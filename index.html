<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#1c1917; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0a09; --card:#1c1917; --text:#fafaf9; --muted:#a8a29e; --line:#292524; --accent:#fafaf9; }
  }
  * { box-sizing:border-box; margin:0; }
  body { font-family:'Cairo',system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; padding:48px 20px; }
  main { width:100%; max-width:420px; text-align:center; }
  .avatar { margin-bottom:16px; width:96px; height:96px; border-radius:50%; background:var(--card); border:1px solid var(--line); margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:700; }
  h1 { font-size:24px; font-weight:700; margin-bottom:32px; }
  p.sub { color:var(--muted); margin:4px 0 32px; }
  .links { display:flex; flex-direction:column; gap:12px; }
  a.link { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; color:var(--text); text-decoration:none; font-weight:600; transition:transform .15s, border-color .15s; }
  a.link:hover { transform:translateY(-2px); border-color:var(--accent); }
  a.link:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a.link span.arrow { color:var(--muted); }
  a.link .l { display:flex; align-items:center; gap:12px; }
  svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
